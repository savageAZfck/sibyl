[package]
name = "sibyl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/sibyl"
homepage = "https://github.com/savageAZfck/sibyl"
license = "MIT"
description = "Oracle-gated memory: secrets sealed behind events — an organism physically cannot recall them until a designated oracle produces a signed claim and the custody share — named for the Sibyl, who spoke only when the time came"
keywords = ["memory", "oracle", "sealed", "sovereignty", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"
aes-gcm = "0.10"

[features]
default = []
